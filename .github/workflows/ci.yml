name: CI

on: [push, pull_request]

# The workflow only reads the repo; restrict the token to least privilege.
permissions:
  contents: read

# Cancel an in-progress run when newer commits land on the same ref/event,
# so rapid pushes don't pile up wasted runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Use bash on every OS (including Windows, via Git Bash) so the run steps
# behave identically everywhere.
defaults:
  run:
    shell: bash

jobs:
  # Lint and type-check results are OS-independent, so each runs once on Linux.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: mypy (strict)
        run: uv run mypy src tests

  # Tests exercise real filesystem/path behaviour, so run them on every OS.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: pytest
        run: uv run pytest
